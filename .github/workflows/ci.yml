name: Pipeline

# Minimum gate for a legacy app: nothing reaches main unless its behavior is
# proven again, on PHP 7.2 (the same version as production and the local
# container). The "why" of every choice below is in docs/ci.md.
#
# Check names read "<stage> · <what it proves>":
#   Static   · PHP syntax + composer.lock      gate
#   Tests    · business rules (kernel)         gate    -> JUnit + testdox
#   Tests    · real HTTP (edge)                gate    -> JUnit + server log
#   Rollback · every migration on MariaDB      gate
#   Evidence · migration snapshot              gate    -> snapshot.json
#   Report   · test coverage                   report  -> HTML + clover
#   Report   · dependency advisories           report  -> audit.json
on:
  # Pushes to main only: a PR branch is already covered by pull_request, and
  # running both doubled every run.
  push:
    branches: [main]
  pull_request:
  # Nightly, with no code change: in a legacy app the environment rots on its
  # own (a retired runner image, a PPA dropping PHP 7.2). This finds out
  # before a PR does. 06:17 UTC = 03:17 in Sao Paulo.
  schedule:
    - cron: '17 6 * * *'
  # Manual run from the Actions tab, e.g. right before a demo.
  workflow_dispatch:

# On a PR, a new push makes the previous run worthless: cancel it. On main,
# never: every merged commit keeps its own complete run as proof.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '7.2'

jobs:
  lint:
    name: Static · PHP syntax + composer.lock
    # ubuntu-20.04 runners were retired in 2025. setup-php installs 7.2 from
    # the ondrej PPA here; same base as the local container (PHP 7.2 on 22.04).
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}

      - name: PHP syntax
        # php -l catches parse errors in files no test loads (view/route/console).
        run: find app database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Composer manifest
        # Catches a composer.lock out of sync with composer.json.
        run: composer validate --no-check-publish

  kernel:
    name: Tests · business rules (kernel)
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p build

      - name: Kernel suite (in-memory SQLite)
        # phpunit.xml forces the in-memory database; TestCase refuses any other.
        run: vendor/bin/phpunit --testdox --log-junit build/kernel-junit.xml --testdox-text build/kernel-testdox.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '### Kernel suite'
            echo
            echo '```'
            tail -n 3 build/kernel-testdox.txt 2>/dev/null || echo 'no report'
            echo '```'
            php -r '$x = @simplexml_load_file("build/kernel-junit.xml"); if ($x) { $s = $x->testsuite; printf("**%d tests, %d assertions, %d failures, %d errors**\n", $s["tests"], $s["assertions"], $s["failures"], $s["errors"]); }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-reports
          path: build/
          retention-days: 30

  edge:
    name: Tests · real HTTP (edge)
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # File-based SQLite: no external service needed in CI.
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE='"$PWD"'/database/database.sqlite#' .env
          sed -i 's#^APP_URL=.*#APP_URL='"$APP_URL"'#' .env
          # The local server is http: a secure cookie never comes back and login fails.
          echo 'SESSION_SECURE_COOKIE=false' >> .env
          php artisan migrate --seed --force
          mkdir -p build

      - name: Edge suite (real HTTP)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > build/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/health" > /dev/null && break
            sleep 1
          done
          php artisan lab:verify --base="$APP_URL" --junit=build/edge-junit.xml

      - name: Summary
        if: always()
        run: |
          {
            echo '### Edge suite (real HTTP)'
            echo
            php -r '$x = @simplexml_load_file("build/edge-junit.xml"); if ($x) { $s = $x->testsuite; printf("**%d tests, %d assertions, %d failures, %d errors** against `php artisan serve`\n", $s["tests"], $s["assertions"], $s["failures"], $s["errors"]); } else { echo "no report\n"; }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-reports
          path: build/
          retention-days: 30

  migrations:
    name: Rollback · every migration on MariaDB
    # "Every step has a rollback" is a claim until something runs the down()
    # methods. This job does, on MariaDB 11.8 (the production engine, same
    # version as the local container), with seeded data in the tables.
    # SQLite is not a rollback target: it rebuilds a table to drop a column
    # and loses its indexes and foreign keys; dev and CI recreate it with
    # migrate:fresh instead.
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mariadb:
        # Exact version, like the actions: same as the local container.
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: atlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: atlas
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Up, with data
        run: php artisan migrate --seed --force

      - name: Down, every step
        run: |
          php artisan migrate:reset --force
          # Nothing may be left applied: a down() that silently does nothing
          # to the migrations table would show up here.
          if php artisan migrate:status | grep -q '| Yes'; then
            php artisan migrate:status
            echo "::error::migrations still applied after migrate:reset"
            exit 1
          fi

      - name: Up again, and seed again
        # Proves every down() left a schema the up() can rebuild from.
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Summary
        if: always()
        run: |
          {
            echo '### Migrations on MariaDB 11.8.9'
            echo
            echo "**$(ls database/migrations/*.php | wc -l) migrations**: up with seed, reset (every down()), up and seed again."
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence · migration snapshot
    # Records the measured state the /migration and home pages read: PHP 8.4
    # blockers plus the results of the two suites. It does not run the suites
    # again: it reads the JUnit reports of the runs that gated this commit, so
    # the snapshot quotes exactly those runs.
    needs: [kernel, edge]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}

      - name: Fetch the suites' reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-reports'
          path: reports

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Measure (blockers + recorded suites)
        run: >
          php artisan lab:snapshot
          --kernel-junit=reports/kernel-reports/kernel-junit.xml
          --edge-junit=reports/edge-reports/edge-junit.xml

      - name: Summary
        if: always()
        run: |
          php -r '
            $s = json_decode(@file_get_contents("storage/app/migration/snapshot.json"), true);
            if (!$s) { echo "### Evidence\n\nno snapshot\n"; exit; }
            echo "### Evidence (lab:snapshot)\n\n";
            echo "| Measure | Value |\n|---|---|\n";
            printf("| PHP | %s |\n| Laravel | %s |\n| PHP 8.4 blockers | %d |\n", $s["php"] ?? "?", $s["laravel"] ?? "?", count($s["blockers"] ?? []));
            foreach ($s["suites"] ?? [] as $suite) {
              printf("| %s | %s, %d tests, %d assertions |\n", $suite["label"], $suite["ok"] ? "green" : "FAILED", $suite["tests"], $suite["assertions"]);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-snapshot
          path: storage/app/migration/snapshot.json
          retention-days: 90

  # ---------------------------------------------------------------- reports
  # Measurements, not gates: they never block a merge. Both answer questions
  # the CTO will ask - "how much of the legacy is frozen?" and "what known
  # risks does it carry?" - with a number from CI instead of an estimate.

  coverage:
    name: Report · test coverage
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}
          # PHPUnit 7.5 predates PCOV support; Xdebug is the driver it knows.
          coverage: xdebug

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p build

      - name: Kernel suite with line coverage of app/
        run: >
          vendor/bin/phpunit --colors=never
          --coverage-text=build/coverage.txt
          --coverage-clover=build/clover.xml
          --coverage-html=build/coverage-html

      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage of `app/` by the kernel suite'
            echo
            echo '```'
            grep -A4 -m1 '^ *Summary:' build/coverage.txt 2>/dev/null | tail -n 4 || echo 'no report'
            echo '```'
            echo
            echo 'The edge suite exercises the same code over real HTTP and is not counted here.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: build/
          retention-days: 30

  audit:
    name: Report · dependency advisories
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php: ${{ env.PHP_VERSION }}
          # composer audit needs Composer 2.4+, and its value is the current
          # advisory database: this report uses the latest 2.x on purpose.
          composer: v2

      - name: Known vulnerabilities and abandoned packages
        # Laravel 5.8 / PHP 7.2 carries known advisories by design: that is
        # the risk the migration removes. Report them; don't fail on them.
        run: |
          mkdir -p build
          composer --version
          composer audit --locked --format=json > build/audit.json || true

      - name: Summary
        if: always()
        run: |
          php -r '
            $a = json_decode(@file_get_contents("build/audit.json"), true);
            echo "### Dependency audit (`composer audit`)\n\n";
            if (!is_array($a)) { echo "no report\n"; exit; }
            $bySeverity = [];
            $packages = 0;
            foreach ($a["advisories"] ?? [] as $package => $list) {
              $packages++;
              foreach ($list as $adv) { $sev = $adv["severity"] ?? "unknown"; $bySeverity[$sev] = ($bySeverity[$sev] ?? 0) + 1; }
            }
            printf("**%d advisories in %d packages.** Expected on Laravel 5.8 / PHP 7.2: this is the risk the migration removes, reported here, not gated.\n\n", array_sum($bySeverity), $packages);
            echo "| Severity | Advisories |\n|---|---|\n";
            foreach (["critical", "high", "medium", "low", "unknown"] as $sev) { if (!empty($bySeverity[$sev])) printf("| %s | %d |\n", $sev, $bySeverity[$sev]); }
            $abandoned = $a["abandoned"] ?? [];
            if ($abandoned) { echo "\n**Abandoned:** " . implode(", ", array_map(function ($p) { return "`$p`"; }, array_keys($abandoned))) . "\n"; }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: build/audit.json
          retention-days: 30
