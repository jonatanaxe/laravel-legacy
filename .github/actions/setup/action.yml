name: Set up PHP and dependencies
description: >
  PHP from setup-php (same version as the local container), Composer cache
  keyed on composer.lock, and composer install. Shared by every job so the
  runtime is identical across them.

inputs:
  php:
    description: PHP version
    required: true

runs:
  using: composite
  steps:
    - name: Install PHP ${{ inputs.php }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php }}
        # curl/dom are for the HTTP suite (tests/Http): Guzzle and HTML via DOM.
        # pdo_mysql is for the migrations job, which runs on MariaDB.
        extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, openssl, tokenizer, xml, curl, dom, ctype, json
        coverage: none

    - name: Composer cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.composer/cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.lock') }}

    - name: Install dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
