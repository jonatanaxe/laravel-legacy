name: Set up PHP and dependencies
description: >
  PHP and Composer from setup-php (same versions as the local container),
  Composer cache keyed on composer.lock, and composer install. Shared by every job so the
  runtime is identical across them.

inputs:
  php:
    description: PHP version
    required: true
  coverage:
    description: Coverage driver (none, xdebug)
    required: false
    default: none
  composer:
    description: Composer version (exact, like the local container's)
    required: false
    default: 2.2.32

runs:
  using: composite
  steps:
    - name: Install PHP ${{ inputs.php }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php }}
        # curl/dom are for the HTTP suite (tests/Http): Guzzle and HTML via DOM.
        # pdo_mysql is for the migrations job, which runs on MariaDB.
        extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, openssl, tokenizer, xml, curl, dom, ctype, json
        coverage: ${{ inputs.coverage }}
        tools: composer:${{ inputs.composer }}

    - name: Composer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.composer/cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.lock') }}

    - name: Install dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
